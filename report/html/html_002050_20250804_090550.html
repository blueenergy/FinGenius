    <style>
        /* FinGenius 品牌色彩和主题变量 */
        :root {
            --fg-primary: #4a6bdf;
            --fg-primary-dark: #3a5bdf;
            --fg-success: #28a745;
            --fg-danger: #dc3545;
            --fg-light-bg: #f8f9fa;
            --fg-white: #ffffff;
            --fg-dark-bg: #1a1d23;
            --fg-dark-card: #2d3748;
            --fg-dark-text: #e2e8f0;
            --fg-border: #dee2e6;
            --fg-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        
        /* 深色模式变量覆盖 */
        [data-theme="dark"] {
            --bs-body-bg: var(--fg-dark-bg);
            --bs-body-color: var(--fg-dark-text);
            --bs-card-bg: var(--fg-dark-card);
            --bs-border-color: #4a5568;
        }
        
        /* 全局样式 */
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            background-color: var(--bs-body-bg, var(--fg-light-bg));
            transition: all 0.3s ease;
        }
        
        /* 导航栏样式 */
        .navbar-brand {
            font-weight: 700;
            color: var(--fg-primary) !important;
            font-size: 1.5rem;
        }
        
        .navbar {
            box-shadow: var(--fg-shadow);
            background-color: var(--bs-card-bg, var(--fg-white)) !important;
        }
        
        /* 卡片统一样式 */
        .card {
            border: none;
            box-shadow: var(--fg-shadow);
            border-radius: 0.75rem;
            background-color: var(--bs-card-bg, var(--fg-white));
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        
        /* 投票结果可视化 */
        .vote-progress {
            height: 1.5rem;
            background-color: var(--fg-border);
            border-radius: 0.75rem;
            overflow: hidden;
            position: relative;
        }
        
        .vote-progress-bullish {
            background: linear-gradient(90deg, var(--fg-success), #34ce57);
            height: 100%;
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .vote-progress-bearish {
            background: linear-gradient(90deg, var(--fg-danger), #e55353);
            height: 100%;
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            position: absolute;
            right: 0;
            top: 0;
        }
        
        /* 时间线样式 */
        .timeline {
            position: relative;
            padding: 2rem 0;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--fg-primary), var(--fg-primary-dark));
            transform: translateX(-50%);
            border-radius: 1.5px;
        }
        
        .timeline-item {
            position: relative;
            margin: 2.5rem 0;
        }
        
        .timeline-item-left .card {
            margin-right: 50%;
            margin-left: 0;
            transform: translateX(-1rem);
        }
        
        .timeline-item-right .card {
            margin-left: 50%;
            margin-right: 0;
            transform: translateX(1rem);
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 1.5rem;
            width: 1rem;
            height: 1rem;
            background-color: var(--fg-primary);
            border: 3px solid var(--bs-body-bg, var(--fg-white));
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        
        /* 移动端时间线适配 */
        @media (max-width: 768px) {
            .timeline::before {
                left: 1rem;
            }
            
            .timeline-item::before {
                left: 1rem;
            }
            
            .timeline-item-left .card,
            .timeline-item-right .card {
                margin-left: 3rem;
                margin-right: 0;
                transform: none;
            }
        }
        
        /* 回到顶部按钮 */
        #backToTop {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background-color: var(--fg-primary);
            border: none;
            color: white;
            display: none;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.2);
        }
        
        #backToTop:hover {
            background-color: var(--fg-primary-dark);
            transform: translateY(-2px);
        }
        
        #backToTop.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 自定义Badge样式 */
        .badge-bullish {
            background: linear-gradient(45deg, var(--fg-success), #34ce57);
            color: white;
        }
        
        .badge-bearish {
            background: linear-gradient(45deg, var(--fg-danger), #e55353);
            color: white;
        }
        
        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        /* Accordion自定义样式 */
        .accordion-button:not(.collapsed) {
            background-color: var(--fg-primary);
            color: white;
        }
        
        .accordion-button:focus {
            box-shadow: 0 0 0 0.25rem rgba(74, 107, 223, 0.25);
        }
    </style>
</head>
